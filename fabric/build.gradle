plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    developmentFabric.extendsFrom common
}

dependencies {
    implementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Fabric API. This is technically optional, but you probably want it anyway.
    implementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    implementation "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"

    implementation("com.terraformersmc:modmenu:${rootProject.modmenu_version}")
    implementation "com.teamresourceful.resourcefulconfig:resourcefulconfig-fabric-$rootProject.resourceful_config_version"

    common(project(path: ':common')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')

    // compile against the JEI API but do not include it at runtime
    compileOnly("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
    compileOnly("mezz.jei:jei-${minecraft_version}-fabric-api:${jei_version}")
    // at runtime, use the full JEI jar for NeoForge
    runtimeOnly("mezz.jei:jei-${minecraft_version}-fabric:${jei_version}")
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: inputs.properties.version
    }
}

shadowJar {
    dependsOn(jar)
    mainSpec.sourcePaths.clear()       // Remove default source set inclusion
    from(zipTree(jar.archiveFile))     // Unpack jar output (preserves Loom modifications)

    configurations = [project.configurations.shadowBundle]
    archiveClassifier = null           // shadowJar becomes the main artifact
}

//remapJar {
//    inputFile.set shadowJar.archiveFile
//}

// Configure Fabric data generation to write generated resources into the common module
def commonProject = project(":common")
fabricApi {
    configureDataGeneration() {
        modId = "$rootProject.archives_name"
        outputDirectory = commonProject.file("src/generated/resources")
        client = true
        addToResources = false
        createSourceSet = false
        strictValidation = false
    }
}
